<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Midi App: MIDI Player &amp; Editor</title>
    <meta name="description" content="Open, play and edit MIDI files in your browser." />

    <!-- Rust/wasm binary. See https://trunkrs.dev/assets/#rust -->
    <link data-trunk rel="rust" data-wasm-opt="z" />
    <!-- Trunk fills in the public URL (set to "./" in Trunk.toml so the build
         works from any folder on your website). -->
    <base data-trunk-public-url />

    <link data-trunk rel="icon" href="assets/favicon.ico" />
    <link data-trunk rel="copy-file" href="assets/manifest.json" />
    <link data-trunk rel="copy-file" href="assets/icon-256.png" />
    <link data-trunk rel="copy-file" href="assets/icon_ios_touch_192.png" />
    <link data-trunk rel="copy-file" href="assets/maskable_icon_x512.png" />
    <link data-trunk rel="copy-file" href="assets/icon-1024.png" />

    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="icon_ios_touch_192.png" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f8f8f8" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1b1b1b" />

    <style>
        html {
            /* Remove touch delay: */
            touch-action: manipulation;
        }

        html,
        body {
            overflow: hidden;
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            background: #f8f8f8;
        }

        @media (prefers-color-scheme: dark) {

            html,
            body {
                background: #1b1b1b;
            }
        }

        /* eframe sizes the canvas to fill its parent. */
        #midi_app_canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #888;
            font: 20px system-ui, -apple-system, Helvetica, sans-serif;
            text-align: center;
        }

        .spinner {
            display: inline-block;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 3px solid #888;
            border-color: #888 transparent #888 transparent;
            animation: spin 1.2s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <!-- The id must match the one in src/main.rs -->
    <canvas id="midi_app_canvas"></canvas>

    <div id="loading">
        <div class="spinner"></div>
        <p>Loading MIDI editor…</p>
        <noscript>This app needs JavaScript (and WebAssembly) enabled.</noscript>
    </div>

    <script>
        // Browsers only allow audio after a user gesture, and Safari only if the
        // AudioContext is created/resumed *inside* that gesture's event handler.
        // egui handles clicks a frame later, so we unlock audio here and the Rust
        // code picks up window.__midiAudioCtx.
        (function () {
            var AC = window.AudioContext || window.webkitAudioContext;
            if (!AC) return;
            function unlock() {
                try {
                    if (!window.__midiAudioCtx) window.__midiAudioCtx = new AC();
                    if (window.__midiAudioCtx.state !== "running") window.__midiAudioCtx.resume();
                } catch (e) { console.warn("Audio unlock failed", e); }
            }
            ["pointerdown", "keydown", "touchend"].forEach(function (ev) {
                window.addEventListener(ev, unlock, { capture: true, passive: true });
            });
        })();

        // Earlier versions of this app registered a service worker that could
        // serve stale files forever. Remove it if it is still installed.
        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.getRegistrations().then(function (regs) {
                regs.forEach(function (r) {
                    var url = (r.active || r.installing || r.waiting || {}).scriptURL || "";
                    if (url.endsWith("/sw.js")) r.unregister();
                });
            }).catch(function () { });
        }
        if (window.caches) {
            caches.delete("egui-template-pwa").catch(function () { });
        }
    </script>
</body>

</html>
