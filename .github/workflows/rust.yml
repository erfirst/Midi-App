name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy, rustfmt
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y pkg-config libwayland-dev libx11-dev libxkbcommon-dev libdbus-1-dev libasound2-dev
    - uses: Swatinem/rust-cache@v2
    - name: Format
      run: cargo fmt --all -- --check
    - name: Clippy
      run: cargo clippy --all-targets -- -D warnings
    - name: Test
      run: cargo test --verbose

  web:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: wasm32-unknown-unknown
        components: clippy
    - uses: Swatinem/rust-cache@v2
    - name: Clippy (wasm)
      run: cargo clippy --target wasm32-unknown-unknown -- -D warnings
    - name: Install trunk
      run: |
        mkdir -p "$HOME/.local/bin"
        curl -sSL https://github.com/trunk-rs/trunk/releases/latest/download/trunk-x86_64-unknown-linux-gnu.tar.gz | tar -xz -C "$HOME/.local/bin"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
    - name: Build web app
      run: trunk build --release
    - name: Upload web build
      uses: actions/upload-artifact@v4
      with:
        name: midi-app-web
        path: dist
