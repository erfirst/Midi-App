[package]
name = "midi_app"
version = "0.2.0"
authors = ["Ethan First"]
edition = "2021"
rust-version = "1.95"
description = "A MIDI reader, player and piano-roll editor that runs natively and on the web."

[dependencies]
egui = "0.37"
eframe = { version = "0.37", default-features = false, features = [
    "default_fonts", # Embed the default egui fonts.
    "glow",          # OpenGL / WebGL backend (small and widely supported).
    "wayland",       # Linux native window backends (ignored on other platforms).
    "x11",
] }
log = "0.4"
midly = "0.5.3"

# native:
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = "0.11"
midir = "0.10"
rfd = "0.15"

# web:
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "AudioContext",
    "AudioContextState",
    "AudioDestinationNode",
    "AudioNode",
    "AudioParam",
    "AudioScheduledSourceNode",
    "BaseAudioContext",
    "Blob",
    "BlobPropertyBag",
    "Document",
    "DynamicsCompressorNode",
    "Element",
    "Event",
    "File",
    "FileList",
    "GainNode",
    "HtmlAnchorElement",
    "HtmlCanvasElement",
    "HtmlElement",
    "HtmlInputElement",
    "OscillatorNode",
    "OscillatorType",
    "Url",
    "Window",
] }

[profile.release]
opt-level = 2 # fast and small wasm
lto = true

# Optimize all dependencies even in debug builds:
[profile.dev.package."*"]
opt-level = 2
